<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frazioni a colori</title>
<style>
:root{color-scheme:light;--ink:#231c34;--muted:#5d546b;--purple:#52358b;--line:#ddd4ea;--paper:#fff}
*{box-sizing:border-box}
body{margin:0;background:#f5f0fa;color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,select,input{font:inherit;color:inherit}
button,select{min-height:44px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:7px 14px}
button{font-weight:700;cursor:pointer}
button.primary{background:var(--purple);color:#fff;border-color:var(--purple)}
button:hover{box-shadow:0 0 0 2px #ae9bc5}
:focus-visible{outline:3px solid #6648a3;outline-offset:3px}
.wrap{width:min(1080px,calc(100% - 28px));margin:0 auto}
header{padding:20px 0 13px}
.kicker{color:var(--purple);font-size:.77rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
h1{font-size:clamp(2.35rem,6vw,4.1rem);line-height:1;margin:.12em 0 .16em;letter-spacing:-.045em}
h2,p{margin:0}
header p,.muted{color:var(--muted)}
.toolbar,.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.toolbar{margin-bottom:13px}
.toolbar label{display:inline-flex;align-items:center;gap:7px;font-weight:650}
.toolbar .print-link{margin-left:auto}
.board{display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,33px);padding:clamp(15px,3vw,29px);background:#fff;border:1px solid var(--line);border-radius:22px}
.visual{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.figure{display:block;width:100%;height:clamp(190px,42vh,360px)}
.visual p{font-size:.83rem;color:var(--muted);margin:3px 0 0}
.work{flex:1 1 330px;min-width:0}
.work h2{font-size:clamp(1.24rem,3vw,1.65rem);line-height:1.2;margin:0 0 5px}
.work>p{font-size:.91rem;color:var(--muted)}
.answers{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.answer{display:flex;align-items:center;justify-content:center;gap:6px;flex:1 1 108px;max-width:150px;padding:8px 5px;border:1px solid var(--line);border-radius:12px;background:#faf8fd}
.answer.good{border-color:#29754e;background:#eaf8ef}
.answer.bad{border-color:#aa4550;background:#fff0f0}
.mini{display:block;width:44px;height:39px;flex:none}
.frac{width:44px;display:inline-flex;flex-direction:column;align-items:stretch;gap:3px;text-align:center;vertical-align:middle}
.frac input{width:100%;min-width:0;height:35px;text-align:center;background:white;border:1px solid #aca1ba;border-radius:6px;font-weight:700;padding:0}
.bar{border-top:2px solid currentColor}
#feedback{min-height:2.9em;margin-top:8px;font-weight:650;color:var(--ink)}
.brand{display:flex;justify-content:center;align-items:center;gap:7px;font-size:.68rem;color:var(--muted);text-align:center;padding:10px 0}
.brand img{width:24px;height:34px;object-fit:contain}
.brand a{color:inherit}
#preview{padding:18px 0}
#preview .toolbar{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:16px}
.sheet{background:#fff;width:min(100%,194mm);min-height:270mm;margin:0 auto 16px;padding:6mm 6mm 3mm;display:flex;flex-direction:column;border-radius:8px}
.sheet h2{font-size:26px;line-height:1.1;margin-bottom:3mm}
.sheet-info{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2mm;font-size:11pt;margin-bottom:2mm}
.sheet-instructions{font-size:10pt;margin-bottom:4mm}
.exercises{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4mm;flex:1;grid-auto-rows:1fr}
.exercise{border:1px solid #bcb1c8;border-radius:3mm;padding:2.5mm 2mm;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.exercise h3{font-size:11pt;margin:0 0 1mm 1mm}
.exercise .figure{height:64mm}
.print-answers{display:flex;align-items:center;justify-content:space-around;gap:2px;padding:1mm 0}
.print-answer{display:flex;align-items:center;gap:2px}
.print-answer .mini{width:7.5mm;height:8mm}
.print-answer .frac{width:8mm;gap:0}
.slot{height:5mm;display:block}
.sheet .brand{font-size:7pt;padding:2mm 0 0}
.sheet .brand img{width:5.5mm;height:8mm}
[hidden]{display:none!important}
@media(max-width:460px){
  .toolbar .print-link{margin-left:0}
  .board{padding:12px}
  .sheet{padding:3mm 2mm}
  .exercises{gap:2mm}
  .exercise{padding:2mm 1mm}
  .print-answers{flex-wrap:wrap}
}
@page{size:A4;margin:9mm}
@media print{
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}
  #game,#preview .toolbar{display:none!important}
  #preview.wrap{display:block!important;width:auto;margin:0;padding:0}
  .sheet{height:276mm;min-height:0;width:100%;margin:0;padding:3mm 1mm 1mm;border-radius:0;break-after:page;page-break-after:always}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  .exercise{break-inside:avoid;page-break-inside:avoid}
  a{text-decoration:none}
}
</style>
</head>
<body>
<main>
<section id="game" class="wrap">
  <header>
    <div class="kicker">Geometria da giocare</div>
    <h1>Frazioni a colori</h1>
    <p>La figura intera vale 1. Che frazione dell’intero è ciascun pezzo indicato?</p>
  </header>
  <div class="toolbar">
    <label for="shape">Figura
      <select id="shape"><option value="mix">Tutte</option><option value="square">Quadrato</option><option value="rect">Rettangolo</option><option value="tri">Triangolo</option></select>
    </label>
    <label for="level">Livello
      <select id="level"><option value="easy">Primi passi</option><option value="hard">Più intrecci</option></select>
    </label>
    <button type="button" class="print-link" id="open-print">Prepara schede</button>
  </div>
  <div class="board">
    <div class="visual"><div id="figure" style="width:100%"></div><p>L’intera figura vale 1.</p></div>
    <form class="work" id="game-form" novalidate>
      <h2>Quanto vale ogni pezzo?</h2>
      <p>Cerca nella figura i pezzi con la stessa lettera.</p>
      <div id="answers" class="answers"></div>
      <div class="actions">
        <button class="primary" type="submit">Controlla</button>
        <button type="button" id="next">Nuova sfida</button>
        <button type="button" id="solution">Mostra soluzioni</button>
      </div>
      <p id="feedback" role="status" aria-live="polite"></p>
    </form>
  </div>
  <div id="screen-brand"></div>
</section>
<section id="preview" class="wrap" hidden aria-label="Anteprima delle schede">
  <div class="toolbar">
    <button type="button" id="back">Torna al gioco</button>
    <label for="pages">Pagine A4
      <select id="pages"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>10</option></select>
    </label>
    <button type="button" id="refresh-print">Genera altre schede</button>
    <button type="button" class="primary" id="print">Stampa / Salva PDF</button>
  </div>
  <div id="sheets"></div>
</section>
</main>

  const colors = ["#b79aeb", "#70c6ed", "#ffc667", "#86d4ac", "#f49cbb", "#d9db71"];
  const shapes = {square:[100,100,"Quadrato"], rect:[132,90,"Rettangolo"], tri:[120,98,"Triangolo"]};
  const letters = "ABC";
  const byId = (id) => document.getElementById(id);
  const pick = (items) => items[Math.floor(Math.random() * items.length)];
  const range = (count) => Array.from({length:count}, (_, index) => index);

  function shuffled(items) {
    const result = items.slice();
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  function rectangle(x, y, w, h) {
    return [[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
  }

  function outline(shape) {
    const [w,h] = shapes[shape];
    return shape === "tri" ? [[0,h],[w,h],[w/2,0]] : rectangle(0,0,w,h);
  }

  function between(a, b, t) {
    return [a[0] + (b[0] - a[0])*t, a[1] + (b[1] - a[1])*t];
  }

  function split(poly, count, method, cuts) {
    const edges = cuts || range(count+1).map(i => i/count);
    if (poly.length === 3) {
      const [a,b,c] = poly;
      if (method === "midpoints") {
        const ab = between(a,b,.5), bc = between(b,c,.5), ca = between(c,a,.5);
        return [[a,ab,ca],[ab,b,bc],[ca,bc,c],[ab,bc,ca]];
      }
      const tipIndex = method === "base" ? 2 : pick([0,1,2]);
      const tip = poly[tipIndex], start = poly[(tipIndex+1)%3], end = poly[(tipIndex+2)%3];
      return range(count).map(i => [between(start,end,edges[i]),between(start,end,edges[i+1]),tip]);
    }
    const [a,b,c,d] = poly;
    if (method === "diagonal") {
      return Math.random() < .5 ? [[a,b,c],[a,c,d]] : [[a,b,d],[b,c,d]];
    }
    const [x,y] = a, w = c[0]-x, h = c[1]-y;
    if (method === "grid") return range(4).map(i => rectangle(x+(i%2)*w/2,y+Math.floor(i/2)*h/2,w/2,h/2));
    if (method === "vertical") return range(count).map(i => rectangle(x+edges[i]*w,y,(edges[i+1]-edges[i])*w,h));
    return range(count).map(i => rectangle(x,y+edges[i]*h,w,(edges[i+1]-edges[i])*h));
  }

  function finish(shape, pieces, targets, palette) {
    return {
      shape,
      pieces: pieces.map((piece, i) => ({
        poly:piece.poly,
        // Polygons are exact equal cuts conceptually. Keep an exact fraction for checking.
        n:piece.n || 1,
        d:piece.d,
        color:palette[i],
        letter:targets.includes(i) ? letters[targets.indexOf(i)] : ""
      })),
      targets
    };
  }

  function firstChallenge() {
    return finish("square", [
      {poly:rectangle(0,0,50,50),d:4},
      {poly:rectangle(0,50,50,50),d:4},
      {poly:rectangle(50,0,50,100),d:2}
    ], [0,2], [colors[0], "#d2bcf5", colors[1]]);
  }

  function generate(shapeChoice, level) {
    const shape = shapeChoice === "mix" ? pick(Object.keys(shapes)) : shapeChoice;
    const hard = level === "hard";
    const count = pick(hard ? [2,3,4,4] : [2,2,2,3,4]);
    let method;
    if (shape === "tri") {
      method = count === 4 ? pick(["midpoints","base","fan"]) : pick(["base","base","fan"]);
    } else if (count === 4) {
      method = pick(["grid","grid","vertical","horizontal"]);
    } else {
      method = pick(count === 2 ? ["vertical","horizontal","diagonal"] : ["vertical","horizontal"]);
    }

    const unequal = hard && count > 2 && Math.random() < .5;
    let pieces;
    if (unequal) {
      const first = Math.random() < .5 ? 1 : count-1;
      const cutMethod = shape === "tri" ? "base" : pick(["vertical","horizontal"]);
      const cut = split(outline(shape), 2, cutMethod, [0,first/count,1]);
      pieces = [{poly:cut[0],n:first,d:count}, {poly:cut[1],n:count-first,d:count}];
    } else {
      pieces = split(outline(shape), count, method).map(poly => ({poly,d:count}));
    }
    const passes = hard ? 2 : pick([0,1,1,1,2]);
    for (let i = 0; i < passes; i++) {
      const limit = hard ? 12 : 4;
      const eligible = pieces.filter(piece => (!piece.n || piece.n === 1) && piece.d * 2 <= limit && pieces.length < 6);
      if (!eligible.length) break;
      const piece = pick(eligible);
      const subCount = hard && piece.d * 3 <= limit && pieces.length <= 4 ? pick([2,2,3]) : 2;
      const subMethod = piece.poly.length === 3 ? "fan" :
        pick(subCount === 2 ? ["vertical","horizontal","diagonal"] : ["vertical","horizontal"]);
      const smaller = split(piece.poly, subCount, subMethod).map(poly => ({poly,d:piece.d*subCount}));
      pieces.splice(pieces.indexOf(piece), 1, ...smaller);
    }

    const [w,h] = shapes[shape];
    const flipX = Math.random() < .5;
    const flipY = shape !== "tri" && Math.random() < .5;
    pieces.forEach(piece => {
      piece.poly = piece.poly.map(([x,y]) => [flipX ? w-x : x, flipY ? h-y : y]);
    });

    const indices = shuffled(range(pieces.length));
    const targets = [indices.shift()];
    const different = indices.findIndex(i => (pieces[i].n || 1) * pieces[targets[0]].d !== (pieces[targets[0]].n || 1) * pieces[i].d);
    if (different >= 0) targets.push(indices.splice(different,1)[0]);
    while (targets.length < Math.min(hard ? 3 : 2,pieces.length)) targets.push(indices.shift());
    return finish(shape, pieces, shuffled(targets), shuffled(colors));
  }

  function layoutKey(challenge) {
    return challenge.shape + ":" + challenge.pieces.map(piece =>
      piece.poly.map(([x,y]) => x.toFixed(4)+","+y.toFixed(4)).sort().join(" ")
    ).sort().join("|");
  }

  function freshChallenge(previous, used) {
    let result;
    for (let attempt = 0; attempt < 100; attempt++) {
      result = generate(byId("shape").value, byId("level").value);
      const key = layoutKey(result);
      if (key !== previous && (!used || !used.has(key))) break;
    }
    return result;
  }

  function polygon(piece, stroke) {
    return '<polygon points="' + piece.poly.map(p => p.join(",")).join(" ") + '" fill="' +
      piece.color + '" stroke="#302443" stroke-width="' + stroke + '" stroke-linejoin="round"/>';
  }

  function label(piece) {
    if (!piece.letter) return "";
    const n = piece.poly.length;
    const x = piece.poly.reduce((sum,p) => sum+p[0],0)/n;
    const y = piece.poly.reduce((sum,p) => sum+p[1],0)/n;
    const edgeDistance = Math.min(...piece.poly.map(([ax,ay],i) => {
      const [bx,by] = piece.poly[(i+1)%n];
      return Math.abs((bx-ax)*(ay-y)-(ax-x)*(by-ay))/Math.hypot(bx-ax,by-ay);
    }));
    const radius = Math.min(5.6, edgeDistance * .88);
    return '<circle cx="'+x+'" cy="'+y+'" r="'+radius+'" fill="#fff" stroke="#302443" stroke-width=".4"/>'+
      '<text x="'+x+'" y="'+(y+radius*.44)+'" font-size="'+(radius*1.27)+'" text-anchor="middle" font-weight="800" fill="#231c34">'+piece.letter+'</text>';
  }

  function drawFigure(challenge) {
    const [w,h,name] = shapes[challenge.shape];
    return '<svg class="figure" viewBox="-3 -3 '+(w+6)+' '+(h+6)+'" role="img" aria-label="'+name+
      ' diviso in '+challenge.pieces.length+' pezzi colorati">'+
      challenge.pieces.map(piece => polygon(piece,1.25)).join("")+
      challenge.pieces.map(label).join("")+'</svg>';
  }

  function thumbnail(piece) {
    const xs = piece.poly.map(p => p[0]), ys = piece.poly.map(p => p[1]);
    const x = Math.min(...xs), y = Math.min(...ys);
    const w = Math.max(...xs)-x, h = Math.max(...ys)-y;
    const pad = Math.max(w,h)*.07;
    return '<svg class="mini" viewBox="'+[x-pad,y-pad,w+2*pad,h+2*pad].join(" ")+'" aria-hidden="true">'+polygon(piece,pad*.43)+'</svg>';
  }

  function brand() {
    return '<footer class="brand"><img src="'+logo+'" alt="Bambina con kalimba">'+
      '<span>Rita Di Ianni · <a href="https://matematichenonsinasce.com">matematichenonsinasce</a> · <em>idee e materiali per la scuola primaria</em></span></footer>';
  }

  let current = firstChallenge();

  function drawGame() {
    byId("figure").innerHTML = drawFigure(current);
    byId("answers").innerHTML = current.targets.map((index,i) => {
      const piece = current.pieces[index], letter = piece.letter;
      return '<div class="answer" id="answer-'+i+'" role="group" aria-label="Pezzo '+letter+'">'+
        thumbnail(piece)+'<strong>'+letter+'</strong><span class="frac">'+
        '<input id="num-'+i+'" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="Numeratore del pezzo '+letter+'">'+
        '<span class="bar" aria-hidden="true"></span>'+
        '<input id="den-'+i+'" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="Denominatore del pezzo '+letter+'"></span></div>';
    }).join("");
    byId("feedback").textContent = "";
  }

  function nextChallenge() {
    current = freshChallenge(layoutKey(current));
    drawGame();
  }

  function assess(event) {
    event.preventDefault();
    const correct = [], wrong = [], missing = [];
    current.targets.forEach((index,i) => {
      const piece = current.pieces[index];
      const numerator = byId("num-"+i), denominator = byId("den-"+i);
      const n = numerator.value.trim(), d = denominator.value.trim();
      const card = byId("answer-"+i);
      card.classList.remove("good","bad");
      if (!n || !d) {
        missing.push(piece.letter);
      } else if (/^[0-9]+$/.test(n) && /^[0-9]+$/.test(d) && +d > 0 && +n * piece.d === +d * piece.n) {
        correct.push(piece.letter);
        card.classList.add("good");
      } else {
        wrong.push(piece.letter);
        card.classList.add("bad");
      }
    });
    const total = current.targets.length;
    byId("feedback").textContent = correct.length === total ? "Tutte le frazioni sono giuste!" : [
      correct.length ? "Giuste: "+correct.join(", ")+ "." : "",
      wrong.length ? "Riprova con "+wrong.join(", ")+ "." : "",
      missing.length ? "Completa "+missing.join(", ")+ "." : ""
    ].filter(Boolean).join(" ");
  }

  function showSolution() {
    byId("feedback").textContent = "Soluzioni: " + current.targets.map(index => {
      const piece = current.pieces[index];
      return piece.letter+" = "+piece.n+"/"+piece.d;
    }).join(" · ");
  }

  function exercise(challenge, number) {
    const answers = challenge.targets.map(index => {
      const piece = challenge.pieces[index];
      return '<div class="print-answer">'+thumbnail(piece)+'<strong>'+piece.letter+
        '</strong><span class="frac" aria-label="Spazio per la frazione"><span class="slot"></span>'+
        '<span class="bar"></span><span class="slot"></span></span></div>';
    }).join("");
    return '<article class="exercise"><h3>Figura '+number+'</h3>'+drawFigure(challenge)+
      '<div class="print-answers">'+answers+'</div></article>';
  }

  function buildSheets() {
    const used = new Set();
    let previous = null;
    byId("sheets").innerHTML = range(Number(byId("pages").value)).map(page => {
      const content = range(4).map(i => {
        const challenge = freshChallenge(previous, used);
        previous = layoutKey(challenge);
        used.add(previous);
        return exercise(challenge, page*4+i+1);
      }).join("");
      return '<section class="sheet"><h2>Frazioni a colori</h2>'+
        '<div class="sheet-info"><span>Nome ________________________</span><span>Data ______________</span></div>'+
        '<p class="sheet-instructions">Ogni figura intera vale 1. Scrivi la frazione dell’intero che corrisponde a ogni pezzo indicato.</p>'+
        '<div class="exercises">'+content+'</div>'+brand()+'</section>';
    }).join("");
  }

  byId("game-form").addEventListener("submit", assess);
  byId("answers").addEventListener("input", event => {
    const card = event.target.closest(".answer");
    if (card) card.classList.remove("good","bad");
    byId("feedback").textContent = "";
  });
  byId("next").addEventListener("click", nextChallenge);
  byId("solution").addEventListener("click", showSolution);
  byId("shape").addEventListener("change", nextChallenge);
  byId("level").addEventListener("change", nextChallenge);
  byId("open-print").addEventListener("click", () => {
    buildSheets();
    byId("game").hidden = true;
    byId("preview").hidden = false;
    byId("back").focus();
    window.scrollTo(0,0);
  });
  byId("back").addEventListener("click", () => {
    byId("preview").hidden = true;
    byId("game").hidden = false;
    byId("open-print").focus();
    window.scrollTo(0,0);
  });
  byId("pages").addEventListener("change", buildSheets);
  byId("refresh-print").addEventListener("click", buildSheets);
  byId("print").addEventListener("click", () => window.print());
  window.addEventListener("beforeprint", () => {
    if (byId("preview").hidden) buildSheets();
  });
  byId("screen-brand").innerHTML = brand();
  drawGame();
})();
</script>
</body>
</html>
