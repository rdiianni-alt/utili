function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

/* Finestra del video */
var modal = document.createElement('div');
modal.className = 'mnsv-modal';

document.body.appendChild(modal);
function closeVideo(){ modal.className = 'mnsv-modal'; modal.querySelector('.mnsv-mv').innerHTML = ''; }
function openVideo(id, title){
  modal.querySelector('.mnsv-mt').textContent = title;
  modal.querySelector('.mnsv-mv').innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="' + esc(title) + '"></iframe>';
  modal.className = 'mnsv-modal on';
}
modal.addEventListener('click', function(e){ if (e.target === modal || e.target.className === 'mnsv-x') closeVideo(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeVideo(); });

var tools = document.createElement('div');
tools.className = 'mnsv-tools';

box.appendChild(tools);
var allBtn = tools.firstChild;
function syncAll(){
  var secs = box.querySelectorAll('.mnsv-sec'), open = secs.length > 0;
  for (var i = 0; i < secs.length; i++) if (!secs[i].open) open = false;
  allBtn.innerHTML = (open ? 'Chiudi tutto' : 'Apri tutto') + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"' + (open ? ' style="transform:rotate(180deg)"' : '') + '><path d="M6 9l6 6 6-6"/></svg>';
  allBtn.setAttribute('data-open', open ? '1' : '');
}

      img.onerror = function(){ if (img.src.indexOf(COPERTINE) === 0) img.src = 'albi/' + file; else img.style.visibility = 'hidden'; };
      if (vid) el.addEventListener('click', function(){ openVideo(vid, b[0]); });
      shelf.appendChild(el);
    });
  });
  box.appendChild(d);
